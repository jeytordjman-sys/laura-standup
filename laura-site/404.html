<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Laura Stand-Up Comedy</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23862357'/%3E%3Ctext x='50' y='72' font-size='68' text-anchor='middle' fill='%23ffae42' font-family='sans-serif'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --yellow: #ffae42;
    --pink: #c35346;
    --dark: #862357;
    --cream: #f0f0f0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--dark);
    color: var(--cream);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    text-align: center;
    overflow-x: hidden;
  }
  .wrap { position: relative; max-width: 620px; width: 100%; }
  .ghost {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -58%);
    font-size: clamp(180px, 42vw, 380px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.04em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255, 174, 66, .16);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .content { position: relative; z-index: 1; }
  .tag {
    display: inline-block;
    background: var(--pink);
    color: #fff;
    font-size: .72rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    font-weight: 500;
    padding: .35rem 1rem;
    border-radius: 2px;
    margin-bottom: 1.75rem;
  }
  h1 {
    font-family: 'Anton', 'Impact', 'Haettenschweiler', sans-serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: uppercase;
  }
  h1 .accent { color: var(--yellow); }
  p {
    margin: 1.5rem auto 0;
    max-width: 420px;
    font-size: 1rem;
    line-height: 1.65;
    color: rgba(240, 240, 240, .72);
  }
  .ctas {
    margin-top: 2.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: 1rem 2rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 500;
    letter-spacing: .05em;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s, background .2s, border-color .2s;
  }
  .btn-primary {
    background: var(--yellow);
    color: #3a0f24;
    box-shadow: 5px 5px 0 rgba(0, 0, 0, .28);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 7px 7px 0 rgba(0, 0, 0, .28); }
  .btn-outline { border: 1.5px solid rgba(240, 240, 240, .35); color: var(--cream); }
  .btn-outline:hover { border-color: var(--cream); background: rgba(255, 255, 255, .06); }
  .links {
    margin-top: 3rem;
    padding-top: 1.75rem;
    border-top: 1px solid rgba(255, 255, 255, .12);
    display: flex;
    flex-wrap: wrap;
    gap: .6rem 1.5rem;
    justify-content: center;
    font-size: .82rem;
  }
  .links a { color: rgba(240, 240, 240, .6); text-decoration: none; transition: color .2s; }
  .links a:hover { color: var(--yellow); }
  @media (max-width: 480px) {
    .btn { padding: .9rem 1.5rem; width: 100%; justify-content: center; }
    .ctas { gap: .75rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ghost" aria-hidden="true">404</div>
    <div class="content">
      <span class="tag">Erro 404</span>
      <h1>ESTA PÁGINA<br><span class="accent">FUGIU DO PALCO</span></h1>
      <p>Nem todas as piadas correm bem — e nem todos os endereços existem. Esta página não foi encontrada, mas o resto do espetáculo continua.</p>
      <div class="ctas">
        <a class="btn btn-primary" href="/">← Voltar ao início</a>
        <a class="btn btn-outline" href="/#contact">Pedir orçamento</a>
      </div>
      <nav class="links">
        <a href="/#about">Bio</a>
        <a href="/#videos">Vídeos</a>
        <a href="/#services">Empresas</a>
        <a href="/#gallery">Galeria</a>
        <a href="/#agenda">Agenda</a>
        <a href="/#faq">FAQ</a>
        <a href="/#contact">Contacto</a>
      </nav>
    </div>
  </div>
</body>
</html>
